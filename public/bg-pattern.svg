<svg width="260" height="260" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
  <!-- شاحنة صغيرة -->
  <g transform="translate(20,30)" fill="#0F3D3E" fill-opacity="0.045">
    <rect x="0" y="8" width="40" height="20" rx="2"/>
    <rect x="40" y="14" width="16" height="14" rx="2"/>
    <circle cx="10" cy="30" r="5"/>
    <circle cx="46" cy="30" r="5"/>
  </g>

  <!-- خط طريق متقطع -->
  <g stroke="#0F3D3E" stroke-opacity="0.05" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round">
    <path d="M10 120 C 60 100, 100 140, 150 120" fill="none"/>
  </g>

  <!-- رصيف / مستودع -->
  <g transform="translate(150,150)" fill="#0F3D3E" fill-opacity="0.045">
    <rect x="0" y="0" width="60" height="36" rx="2"/>
    <rect x="10" y="10" width="18" height="26" fill="#F7F5F0" fill-opacity="1"/>
  </g>

  <!-- علامة موقع صغيرة -->
  <g transform="translate(200,60)" fill="#C2410C" fill-opacity="0.05">
    <circle cx="0" cy="0" r="7"/>
  </g>

  <!-- شاحنة ثانية أصغر -->
  <g transform="translate(190,200)" fill="#0F3D3E" fill-opacity="0.04">
    <rect x="0" y="6" width="30" height="15" rx="2"/>
    <rect x="30" y="10" width="12" height="11" rx="1"/>
    <circle cx="7" cy="22" r="3.5"/>
    <circle cx="34" cy="22" r="3.5"/>
  </g>
</svg>
